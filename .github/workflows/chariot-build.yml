name: chariot-build

# Builds the chariot LFS-filtering jj fork for macOS (Apple Silicon + Intel).
# Both arches are built on a single arm64 runner via cross-compilation so we
# don't depend on scarce macos-13 (Intel) runner scheduling.
# Triggered manually via `gh workflow run`.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -vV

      - name: Build jj (both arches)
        run: |
          cargo build --release --target aarch64-apple-darwin --bin jj
          cargo build --release --target x86_64-apple-darwin --bin jj

      - name: Verify arch + fork marker
        run: |
          file target/aarch64-apple-darwin/release/jj
          file target/x86_64-apple-darwin/release/jj
          # Only the native arm64 binary is runnable here; trust the x86_64
          # build (same source) and confirm its Mach-O arch via `file` above.
          target/aarch64-apple-darwin/release/jj --version
          target/aarch64-apple-darwin/release/jj --version | grep -q chariot-lfs

      - name: Package tarballs
        run: |
          tar -czf jj-aarch64.tar.gz -C target/aarch64-apple-darwin/release jj
          tar -czf jj-x86_64.tar.gz  -C target/x86_64-apple-darwin/release  jj

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jj-binaries
          path: jj-*.tar.gz
          if-no-files-found: error
